services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  agent:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: bash

volumes:
  ollama_data:
